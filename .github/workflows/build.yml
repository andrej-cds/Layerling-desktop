name: Gradnja in izdaja

# Ob oznaki različice (npr. v1.0.1) se program zgradi za Windows in Mac in objavi kot izdaja na GitHubu.
# Programi, ki jih že imate nameščene, jo ob naslednjem preverjanju ponudijo (na Windows) ali javijo (na Macu).
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gradnja:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ukaz: npx electron-builder --win --x64
          - os: macos-latest
            ukaz: npx electron-builder --mac
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Zgradi spletni del (popravki, tipi, testi originalnega programa, gradnja)
        run: node scripts/build-web.mjs --fresh --test
      - name: Različica iz oznake
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Pakiranje (in objava ob oznaki)
        shell: bash
        run: ${{ matrix.ukaz }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: layerling-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  preizkus-v-oknu:
    # Pravi program v Electronu na navideznem zaslonu: zagon, urejevalnik, MCP, samodejno shranjevanje na disk, nastavitve, posodobitve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-web.mjs --fresh
      - run: npx electron-builder --linux --x64 --dir --publish never
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Celoten preizkus
        env:
          E2E_EXECUTABLE: dist/linux-unpacked/layerling-desktop
          LAYERLING_E2E_SOFTGL: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node test-e2e/e2e.mjs
