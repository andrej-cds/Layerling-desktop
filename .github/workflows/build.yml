name: Gradnja in izdaja

# Ob oznaki različice (npr. v1.0.1) se program zgradi za Windows in Mac in objavi kot izdaja na GitHubu.
# Programi, ki jih že imate nameščene, jo ob naslednjem preverjanju ponudijo (na Windows) ali javijo (na Macu).
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gradnja:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ukaz: npx electron-builder --win --x64
          - os: macos-latest
            ukaz: npx electron-builder --mac
          # Starejši macOS (Monterey 12): Electron 44 ga ne podpira več, zato posebna gradnja z Electronom 43 (le Intel, dmg).
          - os: macos-latest
            monterey: true
            ukaz: npx electron-builder --mac dmg --x64 -c.mac.artifactName='Layerling-${version}-Monterey-${arch}.${ext}'
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Electron 43 za macOS Monterey
        if: matrix.monterey
        run: npm install --no-save electron@43.7.9
      - run: npm test
      - name: Zgradi spletni del (popravki, gradnja; testi izvirnika tečejo v Linux opravilu)
        run: node scripts/build-web.mjs --fresh
      - name: Različica iz oznake
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Pakiranje (in objava ob oznaki)
        shell: bash
        run: ${{ matrix.ukaz }} --publish ${{ (startsWith(github.ref, 'refs/tags/v') && !matrix.monterey) && 'always' || 'never' }}
      - name: Monterey: dmg se doda izdaji (brez latest-mac.yml, da ne prepiše običajne posodobitve)
        if: matrix.monterey && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" dist/*Monterey*.dmg --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: layerling-${{ matrix.os }}${{ matrix.monterey && '-monterey' || '' }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  preizkus-v-oknu:
    # Pravi program v Electronu na navideznem zaslonu: zagon, urejevalnik, MCP, samodejno shranjevanje na disk, nastavitve, posodobitve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-web.mjs --fresh --test
      - run: npx electron-builder --linux --x64 --dir --publish never
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Celoten preizkus
        env:
          E2E_EXECUTABLE: dist/linux-unpacked/layerling-desktop
          LAYERLING_E2E_SOFTGL: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node test-e2e/e2e.mjs
